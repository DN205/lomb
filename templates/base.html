<!doctype html>
<html lang="hu">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#e7e9de" />
        <title>{% block title %}Lomb{% endblock %}</title>
        <meta name="description" content="{% block description %}Lomb – magyarországi fafajok adatbázisa.{% endblock %}" />
        <link rel="stylesheet" href="{{ get_url(path='css/tree.css') }}" />
        {% block extra_head %}{% endblock %}
    </head>

    <body>
        <a class="skip-link" href="#main-content">Ugrás a tartalomra</a>

        <main id="main-content">
            {% block content %}{% endblock content %}
        </main>

        {% if current_path != "/" %}
        <a class="home-button" href="{{ get_url(path='/') }}" aria-label="Vissza a főoldalra">
            <svg class="home-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 11.5 12 4l8 7.5" />
                <path d="M6.5 10.5V20h11v-9.5" />
                <path d="M10 20v-5h4v5" />
            </svg>
            <span class="home-button-label">Főoldal</span>
        </a>
        {% endif %}

        <footer class="site-footer">
            <div class="site-footer-inner">
                <p>Lomb — magyarországi fafajok adatbázisa</p>
                <p>{{ now() | date(format="%Y") }}</p>
            </div>
        </footer>

        <script src="{{ get_url(path='js/filter.js') }}" defer></script>
    </body>
</html>
